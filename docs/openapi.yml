openapi: 3.0.0
info:
  version: 1.0.0
  title: Customers Data API
servers:
  - url: 'https://api.prod.euler.tools/customers'
paths:
  /version:
    get:
      summary: 'Retrieves the deployed API Version'
      description: 'The api version is autogenerated on each deploy and is used by the frontend to cleanup caches and notice breaking changes in the components and application'
      operationId: getVersion
      tags:
        - version
      responses:
        '200':
          description: 'Sample response: Details about API Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tokens:
    get:
      summary: 'Retrieves the list of tokens'
      description: 'Retrieves the whole list of tokens available in all blockchains, can be filtered'
      operationId: listTokens
      tags:
        - tokens
      parameters:
        - name: query
          in: query
          required: false
          description: Filters to
          schema:
            type: string
      responses:
        '200':
          description: 'Sample response: Returns the list of all verified tokens in all blockchains, sorted by market cap by default'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tokens/{id}:
    get:
      summary: 'Retrieves the details of a token'
      description: 'Retrieves the basic details about a token'
      operationId: getTokens
      tags:
        - tokens
      parameters:
        - name: id
          in: path
          required: true
          description: the token symbol, as tokenId 
          schema:
            type: string
      responses:
        '200':
          description: 'Sample response: Returns the details for an specific token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pairs:
    get:
      summary: 'Retrieves the list of tokens'
      description: 'Retrieves the whole list of tokens available in all blockchains, can be filtered'
      operationId: listTokens
      tags:
        - tokens
      parameters:
        - name: query
          in: query
          required: false
          description: Filters to
          schema:
            type: string
      responses:
        '200':
          description: 'Sample response: Returns the list of all verified tokens in all blockchains, sorted by market cap by default'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pairs/{id}:
    get:
      summary: 'Retrieves the details of a token'
      description: 'Retrieves the basic details about a token'
      operationId: getTokens
      tags:
        - tokens
      parameters:
        - name: id
          in: path
          required: true
          description: the token symbol, as tokenId 
          schema:
            type: string
      responses:
        '200':
          description: 'Sample response: Returns the details for an specific token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Token:
      type: object
      required:
        - name
        - symbol
      properties:
        name:
          type: string
          example: "Binance Coin"
        symbol:
          type: string
          example: "BNB"
    Version:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"
        date:
          type: string
          format: Data
          example: "2012-04-23T18:25:43.511Z"
    NotFound:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          example: 404
        message:
          type: string
          example: "Token not found"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          example: 500
        message:
          type: string
          example: "Something went wrong"
  parameters:
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      required: true
      schema:
        type: integer
        format: int32
    limitParam:
      name: limit
      in: query
      description: max records to return
      required: true
      schema:
        type: integer
        format: int32
    queryParam:
      name: q
      in: query
      description: query to search in full text search
      required: false
      schema:
        type: string
        
